version: '3.9'

services:
  web:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./src:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    links:
      - php-fpm-ping
  php-fpm-ping:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html
