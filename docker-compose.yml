services:
  web:
    image: nginx:latest
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nginx-proxy
      - backend
    environment:
      - VIRTUAL_HOST=www.ping4.network,www.ping6.network,www.dumpers.xyz
      - LETSENCRYPT_HOST=www.ping4.network,www.ping6.network,www.dumpers.xyz
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-ernstjason1@gmail.com}
    restart: unless-stopped

  php-fpm-ping:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true # always pull php:8-fpm so a rebuild picks up PHP security releases
    volumes:
      - ./data:/data
      - ./src:/var/www/html
      - ./.git:/git:ro # footer shows the deployed commit
    networks:
      - backend
      - ipv6net
    restart: unless-stopped

networks:
  nginx-proxy:
    external: true
  backend:
    driver: bridge
  ipv6net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:a::/64
          gateway: 2001:db8:a::1
